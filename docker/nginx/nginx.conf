# =========================================================================
# Lumina LMS V2 - Local Multi-Instance Verification Reverse Proxy
# 6th Civilians Corporation
#
# IMPORTANT ARCHITECTURE NOTE:
# This Nginx configuration is strictly for local multi-instance testing and
# Docker Compose cluster validation.
#
# In production, edge routing, DDoS mitigation, and SSL termination are handled
# directly by the managed Hetzner Load Balancer.
# =========================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Map WebSocket connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream API Cluster
    # Stateless round-robin load distribution across multiple API container nodes.
    # Cross-instance real-time synchronization is coordinated by Redis Pub/Sub adapter.
    upstream lumina_backend {
        least_conn;
        server api1:5000 max_fails=3 fail_timeout=10s;
        server api2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 30M;

        # Health & Readiness probes passthrough
        location ~ ^/api/v1/(health|ready)$ {
            proxy_pass http://lumina_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # WebSocket and Socket.io gateway
        location /socket.io/ {
            proxy_pass http://lumina_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API & Web Application
        location / {
            proxy_pass http://lumina_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
